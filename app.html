<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basenation | The Foundation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.11.1/ethers.umd.min.js"></script>

    <style>
        :root { --base-blue: #0052FF; --bg-dark: #0A0B0D; --text-main: #F3F4F6; --text-muted: #9CA3AF; }
        body { margin: 0; font-family: -apple-system, sans-serif; background-color: var(--bg-dark); color: var(--text-main); line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; padding: 4rem 2rem; text-align: center; }
        header { padding-top: 2vh; margin-bottom: 2rem; }
        h1 { font-size: 3rem; margin: 0 0 1rem 0; letter-spacing: -0.05em; }
        .highlight { color: var(--base-blue); }
        .vault-container { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 2rem; max-width: 500px; margin: 0 auto; text-align: left; }
        .vault-input { width: 95%; padding: 12px; margin: 5px 0 5px 0; border-radius: 6px; border: 1px solid #333; background: #1A1C20; color: white; font-size: 16px; }
        .vault-btn { width: 100%; padding: 15px; background-color: var(--base-blue); color: white; font-size: 18px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; margin-top: 15px; transition: 0.2s; }
        .btn-claim { background-color: #10B981; } 
        .btn-withdraw { background-color: #EF4444; } 
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Base<span class="highlight">_Nation</span> App</h1>
            <p style="color: var(--text-muted);">Ledger X-Ray V5</p>
        </header>

        <section class="vault-container">
            <h2 style="text-align: center; margin-top: 0;">Vault Dashboard</h2>
            
            <div id="connect-section">
                <button class="vault-btn" id="connect-btn" onclick="connectWallet()">Connect Wallet</button>
            </div>

            <div id="deposit-section" style="display: none;">
                <p style="text-align: center; color: var(--text-muted); font-size: 13px; margin-bottom: 2px;">Connected Wallet:</p>
                <p id="wallet-address-display" style="color: var(--base-blue); font-size: 15px; text-align: center; font-weight: bold; margin-top: 0;"></p>
                
                <hr style="border-color: rgba(255,255,255,0.1); margin: 30px 0;">
                <h3 style="text-align: center; margin-bottom: 5px;">Deposit to Vault</h3>
                <p style="font-size: 13px; color: var(--text-muted); text-align: center; margin-top: 0;">Enter USD value for each token.</p>
                <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 5px;">
                    <input type="number" id="deposit-weth-usd" class="vault-input" placeholder="$ WETH" step="1">
                    <input type="number" id="deposit-usdc-usd" class="vault-input" placeholder="$ USDC" step="1">
                </div>
                <button class="vault-btn btn-claim" id="deposit-btn" onclick="executeDeposit()" style="margin-top: 5px; background-color: var(--base-blue);">Deposit & Stake</button>

                <hr style="border-color: rgba(255,255,255,0.1); margin: 30px 0;">
                <h3 style="text-align: center; margin-bottom: 5px;">Your Active Positions</h3>
                <p style="font-size: 13px; color: var(--text-muted); text-align: center; margin-top: 0;">Manage your deposited Aerodrome NFTs.</p>
                
                <div id="positions-container">
                    <p style="text-align: center; color: var(--text-muted);">Loading positions...</p>
                </div>
                
                <p id="manage-error-display" style="color: #FF4444; font-size: 14px; margin-top: 15px; text-align: left; font-weight: bold; word-break: break-all; background: rgba(255,0,0,0.1); padding: 10px; border-radius: 6px; display: none;"></p>
            </div>
        </section>
    </div>

    <script>
        const VAULT_ADDRESS = "0xD5Af94570813f44AF63FbBe2A49CC1c822A28F8e";
        const BASE_CHAIN_ID = 8453n;
        const BASE_CHAIN_HEX = '0x2105'; 
        
        const WETH_ADDRESS = "0x4200000000000000000000000000000000000006";
        const USDC_ADDRESS = "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913";
        const POOL_ADDRESS = "0x3fe04a59ebd38cf06080a6f60a98d124eb59392a";
        
        const ERC20_ABI = [
            "function approve(address spender, uint256 amount) external returns (bool)"
        ];
        
        const POOL_ABI = [
            "function slot0() external view returns (uint160 sqrtPriceX96, int24 tick, uint16 observationIndex, uint16 observationCardinality, uint16 observationCardinalityNext, bool unlocked)"
        ];

        // ADDED: positionOwner, getUserPositions, and depositAndStake to the ABI
        const VAULT_ABI = [
            "function claimRewards(uint256 tokenId) external",
            "function withdrawPosition(uint256 tokenId) external",
            "function positionOwner(uint256 tokenId) external view returns (address)",
            "function getUserPositions(address user) external view returns (uint256[])",
            "function depositAndStake(uint256 amount0ToAdd, uint256 amount1ToAdd, uint256 amount0Min, uint256 amount1Min, int24 tickSpacing, int24 tickLower, int24 tickUpper) external returns (uint256)"
        ];

        let userSigner = null;
        let provider = null;
        let globalUserAddress = null;

        async function connectWallet() {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    provider = new ethers.BrowserProvider(window.ethereum);
                    const network = await provider.getNetwork();
                    if (network.chainId !== BASE_CHAIN_ID) {
                        await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: BASE_CHAIN_HEX }] });
                        provider = new ethers.BrowserProvider(window.ethereum);
                    }
                    const accounts = await provider.send("eth_requestAccounts", []);
                    userSigner = await provider.getSigner();
                    globalUserAddress = accounts[0];
                    
                    document.getElementById('connect-section').style.display = 'none';
                    document.getElementById('deposit-section').style.display = 'block';
                    document.getElementById('wallet-address-display').innerText = globalUserAddress.substring(0, 6) + "..." + globalUserAddress.substring(globalUserAddress.length - 4);
                    
                    await loadUserPositions();
                } catch (error) {
                    alert("Connection failed: " + error.message);
                }
            } else {
                alert("No Web3 wallet detected!");
            }
        }

        function displayError(title, message) {
            const errDisplay = document.getElementById('manage-error-display');
            errDisplay.style.display = 'block';
            errDisplay.innerHTML = `🚨 <b>${title}</b><br><br>${message}`;
        }

        // =====================================
        // THE X-RAY PRE-CHECK
        // =====================================
        async function runLedgerCheck(vaultContract, tokenIdRaw) {
            try {
                const owner = await vaultContract.positionOwner(BigInt(tokenIdRaw.trim()));
                
                if (owner === "0x0000000000000000000000000000000000000000") {
                    displayError("NFT DELETED BY BOT", "Your Keeper Bot likely rebalanced this position! NFT " + tokenIdRaw + " was destroyed and a new one was minted. Check the 'ERC721 Token Txns' tab on your Vault's BaseScan page to find your new Token ID.");
                    return false;
                }
                
                if (owner.toLowerCase() !== globalUserAddress.toLowerCase()) {
                    displayError("WRONG OWNER", "This NFT is registered to a different wallet address in the Vault ledger.");
                    return false;
                }
                
                return true; // You own it, proceed!
            } catch (error) {
                displayError("LEDGER READ ERROR", error.message);
                return false;
            }
        }

        async function loadUserPositions() {
            const container = document.getElementById('positions-container');
            container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">Loading positions...</p>';
            try {
                const vaultContract = new ethers.Contract(VAULT_ADDRESS, VAULT_ABI, provider);
                const positions = await vaultContract.getUserPositions(globalUserAddress);
                
                if (positions.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">No active positions found.</p>';
                    return;
                }
                
                container.innerHTML = '';
                for (let i = 0; i < positions.length; i++) {
                    const tokenId = positions[i].toString();
                    
                    const card = document.createElement('div');
                    card.style.background = 'rgba(255, 255, 255, 0.05)';
                    card.style.border = '1px solid rgba(255, 255, 255, 0.1)';
                    card.style.borderRadius = '8px';
                    card.style.padding = '15px';
                    card.style.marginTop = '10px';
                    card.style.textAlign = 'center';
                    
                    card.innerHTML = `
                        <h4 style="margin: 0 0 10px 0; color: var(--base-blue);">NFT ID: ${tokenId}</h4>
                        <div style="display: flex; gap: 10px;">
                            <button class="vault-btn btn-claim" id="claim-btn-${tokenId}" onclick="executeClaim('${tokenId}')" style="margin-top: 0;">Claim AERO</button>
                            <button class="vault-btn btn-withdraw" id="withdraw-btn-${tokenId}" onclick="executeWithdraw('${tokenId}')" style="margin-top: 0;">Withdraw</button>
                        </div>
                    `;
                    container.appendChild(card);
                }
            } catch (error) {
                container.innerHTML = '<p style="text-align: center; color: #FF4444;">Failed to load positions.</p>';
                console.error(error);
            }
        }

        async function executeDeposit() {
            if (!userSigner) return alert("Connect wallet first.");
            let wethUsd = parseFloat(document.getElementById('deposit-weth-usd').value) || 0;
            let usdcUsd = parseFloat(document.getElementById('deposit-usdc-usd').value) || 0;
            if (wethUsd <= 0 && usdcUsd <= 0) return alert("Enter a valid USD amount in at least one box.");

            const btn = document.getElementById('deposit-btn');
            const errDisplay = document.getElementById('manage-error-display');
            btn.disabled = true;
            errDisplay.style.display = 'block';
            errDisplay.style.color = 'var(--text-main)';
            errDisplay.innerText = "Step 1: Calculating WETH/USDC amounts from live price...";

            try {
                const poolContract = new ethers.Contract(POOL_ADDRESS, POOL_ABI, provider);
                const slot0 = await poolContract.slot0();
                const currentTick = Number(slot0.tick);
                
                const ratio = Math.pow(1.0001, currentTick);
                const wethPriceUsd = ratio * Math.pow(10, 12); 

                const wethTokens = wethUsd / wethPriceUsd;
                const usdcTokens = usdcUsd;

                const wethWei = ethers.parseUnits(wethTokens.toFixed(18), 18);
                const usdcMwei = ethers.parseUnits(usdcTokens.toFixed(6), 6);

                const wethContract = new ethers.Contract(WETH_ADDRESS, ERC20_ABI, userSigner);
                const usdcContract = new ethers.Contract(USDC_ADDRESS, ERC20_ABI, userSigner);

                errDisplay.innerText = "Step 2: Approving WETH...";
                const wethTx = await wethContract.approve(VAULT_ADDRESS, wethWei);
                await wethTx.wait();

                errDisplay.innerText = "Step 3: Approving USDC...";
                const usdcTx = await usdcContract.approve(VAULT_ADDRESS, usdcMwei);
                await usdcTx.wait();

                errDisplay.innerText = "Step 4: Depositing & Staking to Vault...";
                const vaultContract = new ethers.Contract(VAULT_ADDRESS, VAULT_ABI, userSigner);
                
                // Set tick range +/- 150 ticks (~1.5% range, rounded to nearest tick spacing 50)
                let tickLower = currentTick - (currentTick % 50) - 150;
                let tickUpper = currentTick - (currentTick % 50) + 150;

                const depositTx = await vaultContract.depositAndStake(
                    wethWei, usdcMwei, 0n, 0n, 50n, BigInt(tickLower), BigInt(tickUpper)
                );
                
                errDisplay.innerText = "Deposit TX sent! Hash: " + depositTx.hash;
                await depositTx.wait();

                errDisplay.style.color = '#10B981';
                errDisplay.innerText = "Deposit successful! Loading your new position...";
                document.getElementById('deposit-weth-usd').value = "";
                document.getElementById('deposit-usdc-usd').value = "";
                await loadUserPositions();
                btn.disabled = false;
            } catch (error) {
                displayError("DEPOSIT FAILED", error.reason || error.shortMessage || error.message);
                btn.disabled = false;
            }
        }

        async function executeClaim(tokenIdRaw) {
            if (!userSigner) return alert("Connect wallet first.");
            if (!tokenIdRaw) return alert("Enter NFT ID");

            const btn = document.getElementById('claim-btn-' + tokenIdRaw);
            const errDisplay = document.getElementById('manage-error-display');
            btn.disabled = true;
            errDisplay.style.display = 'none';

            try {
                const vaultContract = new ethers.Contract(VAULT_ADDRESS, VAULT_ABI, userSigner);
                
                // Run the X-Ray
                const isOwned = await runLedgerCheck(vaultContract, tokenIdRaw);
                if (!isOwned) { btn.disabled = false; return; }

                let tx = await vaultContract.claimRewards(BigInt(tokenIdRaw.trim()), { gasLimit: 500000 });
                
                errDisplay.style.display = 'block';
                errDisplay.style.color = '#10B981';
                errDisplay.innerText = "Tx sent! Waiting for confirmation... Hash: " + tx.hash;
                await tx.wait();
                
                errDisplay.innerText = "AERO Rewards successfully claimed!";
                btn.disabled = false;
            } catch (error) {
                displayError("TRANSACTION FAILED", error.reason || error.shortMessage || error.message);
                btn.disabled = false;
            }
        }

        async function executeWithdraw(tokenIdRaw) {
            if (!userSigner) return alert("Connect wallet first.");
            if (!tokenIdRaw) return alert("Enter NFT ID");

            const btn = document.getElementById('withdraw-btn-' + tokenIdRaw);
            const errDisplay = document.getElementById('manage-error-display');
            btn.disabled = true;
            errDisplay.style.display = 'none';

            try {
                const vaultContract = new ethers.Contract(VAULT_ADDRESS, VAULT_ABI, userSigner);
                
                // Run the X-Ray
                const isOwned = await runLedgerCheck(vaultContract, tokenIdRaw);
                if (!isOwned) { btn.disabled = false; return; }
                
                let tx = await vaultContract.withdrawPosition(BigInt(tokenIdRaw.trim()), { gasLimit: 800000 });
                
                errDisplay.style.display = 'block';
                errDisplay.style.color = '#10B981';
                errDisplay.innerText = "Tx sent! Waiting for confirmation... Hash: " + tx.hash;
                await tx.wait();
                
                errDisplay.innerText = "Position Withdrawn! The NFT is back in your wallet.";
                // Refresh positions
                await loadUserPositions();
                btn.disabled = false;
            } catch (error) {
                displayError("TRANSACTION FAILED", error.reason || error.shortMessage || error.message);
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
