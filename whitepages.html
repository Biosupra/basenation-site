<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whitepages | Basenation</title>
  <style>
    /* Consistent Root Variables */
    :root {
      --base-blue: #0052FF;
      --bg-dark: #0A0B0D;
      --text-main: #F3F4F6;
      --text-muted: #9CA3AF;
    }
    
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh; /* Centers content vertically */
    }

    .construction-container {
      max-width: 800px;
      text-align: center;
    }

    /* ASCII Dinosaur Style */
    .dino-visual {
      color: var(--base-blue);
      font-family: monospace; /* Essential for ASCII alignment */
      font-size: 14px;
      line-height: 1.2;
      margin-bottom: 30px;
      white-space: pre; /* Prevents text from wrapping awkwardly */
      overflow-x: auto; /* Adds scrollbar on mobile if needed */
    }

    /* Bold, Fun Text Style */
    .fun-text {
      color: var(--text-main);
      font-size: 2.5rem;
      font-weight: 900; /* Extra bold */
      letter-spacing: -1px;
      margin: 0;
    }

    .sub-text {
      color: var(--text-muted);
      margin-top: 10px;
    }

    a.back-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      position: absolute;
      top: 40px;
      left: 40px;
    }

    a.back-link:hover {
      color: var(--text-main);
    }
  </style>
</head>
<body>
  
  <a href="index.html" class="back-link">&larr; Back to Home</a>
  
  <div class="construction-container">
      
    <!-- ASCII Dinosaur Visual -->
    <div class="dino-visual">
               ______
             _/      \
            / o    ___\
           |      /
    _______/_____/____
    /                  \
   /    /\_____/\    /  \
  /    /         \  /    \
 (_____)         (_____)
  |   |           |   |
  |___|           |___|
    </div>

    <p class="fun-text">Working on it, we promise!</p>
    <p class="sub-text">The detailed technical documentation is currently under heavy development. Stay tuned.</p>
  </div>

</body>
</html>
